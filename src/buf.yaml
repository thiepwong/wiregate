version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  # The frozen RPC contract intentionally reuses OperationPlan,
  # CommitOperationRequest, OperationRef and ArtifactChunk across typed
  # operations. Field-level schemas remain method-specific at preview time.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
